<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anggota — Kelompok 10</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="in"><a class="logo" href="index.html">Kelompok 10</a><nav><a href="index.html">Beranda</a><a href="galeri.html">Galeri</a><a href="anggota.html" class="on">Anggota</a></nav></div></header>
<main class="wrap"><section class="head"><h1>Para Anggota Kelompok 10</h1><p class="lead">Klik kartu nama untuk melihat detail dan akun Instagram.</p></section>
<section class="badges" id="grid"></section></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"><button class="x" id="close" aria-label="Tutup">×</button><div id="detail"></div></div></div>
<footer>© Kelompok 10</footer>
<script>

const members=[
 {nama:"Muhammad Ziya Ulhaq",peran:"Ketua",npm:"267006111196",ig:"ziyaaulll_",foto:"foto/ziya.jpg"},
 {nama:"Khoirul Rizki Maulidan",peran:"Anggota",npm:"267006111140",ig:"username",foto:"foto/khoirul.jpg"},
 {nama:"Galang Naelul Gifar",peran:"Anggota",npm:"267006111069",ig:"username",foto:"foto/galang.jpg"},
 {nama:"Fathir Putra Sampurna",peran:"Anggota",npm:"267006111070",ig:"fathirsams",foto:"foto/fathir.jpg"},
 {nama:"Yara Rahma Nathania",peran:"Anggota",npm:"267006111189",ig:"username",foto:"foto/yara.jpg"},
 {nama:"Farhan Hidayatullah",peran:"Anggota",npm:"267006111137",ig:"username",foto:"foto/farhan.jpg"},
 {nama:"Fayza Maheswara Haydar Rachman",peran:"Anggota",npm:"267006111073",ig:"username",foto:"foto/fayza.jpg"},
 {nama:"Fauzan Muslim",peran:"Anggota",npm:"267006111137",ig:"username",foto:"foto/fauzan.jpg"},
 {nama:"Alya Fazilatun Nisa",peran:"Anggota",npm:"267006111133",ig:"username",foto:"foto/alya.jpg"},
 {nama:"Syifa Shofariyah",peran:"Anggota",npm:"267006111049",ig:"username",foto:"foto/syifa.jpg"},
 {nama:"Reza Sapitra",peran:"Anggota",npm:"267006111110",ig:"username",foto:"foto/reza.jpg"}
];

const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const av=m=>'<div class="av">'+(m.foto?'<img src="'+esc(m.foto)+'" alt="'+esc(m.nama)+'" onerror="this.parentNode.textContent=\''+esc(m.nama[0])+'\'">':esc(m.nama[0]))+'</div>';
const info=m=>'<p class="name">'+esc(m.nama)+'</p><p class="meta"><b>NPM</b> '+(esc(m.npm)||'-')+'</p><p class="meta"><b>Instagram</b> '+(m.ig?'@'+esc(m.ig):'-')+'</p>';
const grid=document.getElementById('grid'),modal=document.getElementById('modal'),detail=document.getElementById('detail');
members.forEach(m=>{
 const b=document.createElement('button');b.className='badge'+(m.peran==='Ketua'?' ketua':'');
 b.innerHTML='<div class="band">'+esc(m.peran)+'</div>'+av(m)+'<div class="bd">'+info(m)+'</div>';
 b.onclick=()=>{detail.innerHTML=av(m)+info(m)+(m.ig?'<a class="btn ig" href="https://instagram.com/'+encodeURIComponent(m.ig)+'" target="_blank" rel="noopener">Buka Instagram</a>':'');modal.classList.add('show')};
 grid.appendChild(b)});
const hide=()=>modal.classList.remove('show');
document.getElementById('close').onclick=hide;modal.onclick=e=>{if(e.target===modal)hide()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
</script></body></html>
